services:
  mysql:
    image: mysql:8.0
    container_name: phoenixtask-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-phoenixtask}
      MYSQL_USER: ${MYSQL_USER:-phoenixtask}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-phoenixtask}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: phoenixtask-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      BACKEND_PORT: ${BACKEND_PORT:-8080}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-phoenixtask}
      MYSQL_USER: ${MYSQL_USER:-phoenixtask}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-phoenixtask}
    ports:
      - "${BACKEND_PORT:-8080}:8080"

volumes:
  mysql_data:
