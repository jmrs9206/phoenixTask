spring:
  datasource:
    url: jdbc:postgresql://${PHOENIXTASK_DB_HOST:localhost}:${PHOENIXTASK_DB_PORT:5433}/${PHOENIXTASK_CONTROL_DB:phoenixtask_local}
    username: ${PHOENIXTASK_DB_USER:phoenixtask}
    password: ${PHOENIXTASK_DB_PASSWORD:phoenixtask_local}
    driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

phoenixtask:
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:3003
  workspace:
    datasource:
      host: ${PHOENIXTASK_WS_DB_HOST:localhost}
      port: ${PHOENIXTASK_WS_DB_PORT:5433}
      database: ${PHOENIXTASK_WS_DB_NAME:phoenixtask_demo}
      schema: ${PHOENIXTASK_WS_DB_SCHEMA:public}
      username: ${PHOENIXTASK_WS_DB_USER:phoenixtask}
      password: ${PHOENIXTASK_WS_DB_PASSWORD:phoenixtask_local}
      cache:
        maxSize: 32
        expireAfterMinutes: 30
    flyway:
      locations:
        - classpath:db/migration/workspace

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: phoenixtask
