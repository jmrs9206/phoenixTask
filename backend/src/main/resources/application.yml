spring:
  application:
    name: phoenixtask
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration/controlplane
    baseline-on-migrate: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
management:
  endpoints:
    web:
      exposure:
        include: health,info
server:
  port: 8080

phoenixtask:
  cors:
    allowed-origins: []
  auth:
    session:
      ttl-minutes: 720
      token-bytes: 32
  workspace:
    attachments:
      root: ${PHOENIXTASK_ATTACHMENTS_ROOT:./storage/attachments}
      max-bytes: ${PHOENIXTASK_ATTACHMENTS_MAX_BYTES:10485760}
