version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: phoenixtask-postgres
    ports:
      - "${PHOENIXTASK_PG_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-phoenixtask}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-phoenixtask_local}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

volumes:
  postgres_data:
